<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор постов</title>
  <!-- Подключаем шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <!-- Подключаем библиотеку html-to-image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="panel">
      <h1>Редактор поста</h1>
      
      <label>Выберите шаблон:
        <select id="template-selector">
          <option value="guess">Угадай по фото (3 шт)</option>
          <option value="battle">Битва (2 шт)</option>
        </select>
      </label>

      <hr class="divider">
      <div id="dynamic-inputs"></div>
      <button id="btn-export">Скачать картинку</button>
    </aside>

    <main class="preview-area">
      <div class="canvas-wrapper">
        <div class="post-canvas" id="post-canvas"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
