.tut .ex b{display:block;font:700 15px Oswald,sans-serif;margin-bottom:4px;color:var(--ink)}
.tut .ex p{margin:0 0 6px;font-size:14px;line-height:1.6}
.tut .ex a{font-size:13px;font-weight:500;color:var(--link,var(--acc));text-underline-offset:3px}
.tut .rulesbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.tut .rulesbox b{display:block;font:700 16px Oswald,sans-serif;margin-bottom:6px}
.rlst{display:grid;gap:8px;margin:10px 0 0}
.ritem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.rno{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--acc);background:var(--card);border:1px solid var(--deco);padding:5px 7px;border-radius:5px;flex:none;transform:rotate(-2deg)}
.ritem b{display:block;font:700 15px Oswald,sans-serif;margin-bottom:1px}
.ritem p{margin:0;font-size:13px;color:var(--muted)}
a.b{display:inline-block;text-decoration:none;text-align:center}
.tutwrap{padding:0;border:0;background:none}.tutwrap>summary{font:700 18px Oswald,sans-serif;padding:8px 2px}

    {title:'Структура грамотного поста',time:'20 минут',intro:'У публикации должна быть логичная последовательность. Не все блоки обязательны для каждого формата, но читатель всегда должен понимать смысл и действие.',points:['Приветствие: «Доброго времени суток, уважаемые игроки сервера Surgut!»','Автор: «На связи: редактор группы — [Твой_Ник]».','Тема: коротко назови рубрику или событие.','Основной текст: объясни суть в нескольких коротких предложениях.','Задание или вопрос: точно опиши, что требуется от участника.','Призыв к действию: укажи, где и в каком виде оставить ответ.','Приз и форма ответа: добавляй только тогда, когда они действительно предусмотрены и согласованы.','Завершение и ссылки: пожелание участникам; ссылки на Беседу, Discord и Форум оставляй в конце, согласно действующей инструкции группы.'],example:'Без приза: попроси игроков написать мнение в комментариях. Не добавляй форму банковского счёта. С призом: заранее согласуй награду и укажи точную форму ответа, предусмотренную условиями конкурса.',homework:'Напиши текст из приветствия, темы, задания, призыва и завершения.'},

    {title:'Создание афиш и визуальное оформление',time:'25 минут',intro:'Изображение должно дополнять пост, а не мешать прочитать его. Основной просмотр часто происходит с телефона.',points:['Начни с одного главного сообщения: заголовок должен читаться быстрее остальных элементов.','Используй скриншот из игры или изображение, которое действительно соответствует теме.','Размещай текст на контрастном фоне, оставляй свободное пространство и не перегружай макет мелкими деталями.','Проверь композицию: главный объект и ключевой текст не должны перекрывать друг друга.','Выбери подходящий формат: 16:9, квадрат, 4:5 или сторис — в зависимости от размещения.','Проверь готовый PNG на телефоне: читаются ли заголовок, вопрос, приз и важные условия.','Не добавляй в афишу неподтверждённые цены, награды, логотипы или чужие данные.'],example:'Для викторины сделай крупный заголовок, отдельный блок с вопросом и ясное обозначение приза. Второстепенный текст не должен конкурировать с вопросом.',homework:'Создай афишу в шаблоне или конструкторе сайта, затем проверь её на экране телефона.'},
    {title:'Работа с нейросетями и промптами',time:'25 минут',intro:'Нейросеть может ускорить подготовку идеи, черновика текста и изображения. Ответ нейросети всегда нужно проверять.',points:['Для текста укажи формат поста, аудиторию, тон, обязательные сведения и ограничения.','Для изображения опиши главный объект, окружение, освещение, ракурс, стиль, композицию и соотношение сторон.','Отдельно перечисли, чего не должно быть: лишних надписей, случайных логотипов, водяных знаков и искажённых деталей.','Проверяй все игровые факты, даты, названия и условия вручную. Нейросеть может придумать неверные сведения.','Перепиши черновик под стиль сообщества и свой голос; не публикуй сырой результат.','Не отправляй в сторонние сервисы пароли, личные переписки, персональные данные или закрытую служебную информацию.'],example:'Промпт для картинки: «Создай вертикальную афишу 4:5 для игровой викторины BLACK RUSSIA | SURGUT. Главный объект — автомобиль на ночной улице, фиолетовое освещение, чистая композиция, свободное место сверху под заголовок. Не добавляй мелкий случайный текст».',homework:'Подготовь один промпт для изображения и один запрос для черновика текста.'},
    {title:'Проверка качества и типичные ошибки',time:'15 минут',intro:'Перед отправкой редактор проверяет содержание, язык и внешний вид публикации.',points:['Проверь правильность никнеймов, названий организаций, игровых объектов и сервера.','Сверь даты, время, суммы призов, число победителей и условия участия.','Прочитай текст вслух: слишком длинные и сложные предложения лучше упростить.','Удали повторы, лишние эмодзи, пустые обещания и фразы, не связанные с темой.','Проверь ссылки и правильность формы ответа.','Открой картинку на телефоне и убедись, что текст не обрезан.','Убедись, что идея не является копированием чужого поста.'],example:'Ошибка: «Победитель получит приз» без пояснения, кто и как станет победителем. Исправление: заранее прописать критерий определения победителя и сроки.',homework:'Возьми старый черновик, найди в нём минимум пять проблем и исправь их.'},
    {title:'Предложение поста и отчётность',time:'15 минут',intro:'По текущей инструкции редакции публикацию нужно отправить через предложенные посты и передать подтверждение в группу отчётности.',points:['Подготовь финальный текст и прикрепи готовое изображение или скриншот.','Открой сообщество BLACK RUSSIA | SURGUT и нажми «Предложить пост».','Вставь текст, прикрепи визуальный материал и отправь публикацию на рассмотрение.','Не жди, пока пост появится в общей ленте: открой раздел «Предложенные посты».','Сделай скриншот записи из этого раздела так, чтобы были видны твоё имя, дата и время, текст и изображение.','Отправь этот скриншот в группу отчётности.','Если материал отклонили или попросили исправить, внеси корректировки и следуй указаниям руководства.'],example:'Важно: по инструкции сайта скриншот для отчёта берётся из «Предложенных постов», а не из опубликованной записи в ленте.',homework:'Подготовь тренировочный пост и составь список действий от отправки до отчётности.'}
  ];
  var lessonsSection=section('academy-lessons','Учебная программа: 8 уроков','Изучай темы по порядку.',lessons.map(function(l,i){return h('details',{class:'academy-lesson'},[

  var ideaRows=[
    ['Викторина','Угадай автомобиль по трём подсказкам.','guess'],['Викторина','Угадай локацию по небольшому фрагменту карты.','guess'],['Викторина','Определи игровую организацию по трём фактам.','quiz'],['Викторина','Угадай предмет по увеличенному фрагменту.','guess'],['Поиск','Найди спрятанный предмет на игровом скриншоте.','game'],['Поиск','Найди пять отличий между двумя изображениями.','game'],['Опрос','Какой тип мероприятий игроки хотят видеть чаще?','poll'],['Опрос','Выбери лучший автомобиль из трёх вариантов.','poll'],['Опрос','Какую игровую функцию стоит улучшить в первую очередь?','poll'],['Конкурс','Повтори заданный игровой скриншот.','contest'],['Конкурс','Создай необычный образ персонажа на заданную тему.','contest'],['Конкурс','Сделай фото в указанной игровой локации.','contest'],['Игровая тема','Угадай машину по силуэту или фарам.','game'],['Игровая тема','Определи место на карте по виду дороги.','game'],['Игровая тема','Собери автомобиль из перемешанных деталей.','game'],['Мнение','Какой район карты кажется самым опасным и почему?','poll'],['История','Вспомни важное событие сервера по трём подсказкам.','quiz'],['Творчество','Предложи название новой рубрики для сообщества.','contest']

<script>
/* ===== RG STUDIO 2.0: рабочее пространство редактора ===== */
(function(){
'use strict';
var STORE='rg-studio-v2';
function read(){
  try{return JSON.parse(localStorage.getItem(STORE))||{posts:[],projects:[],ideas:[],stats:{}}}
  catch(e){return {posts:[],projects:[],ideas:[],stats:{}}}
}
var db=read();
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){return false}}
function el(tag,attrs,children){
  var n=document.createElement(tag);
  Object.keys(attrs||{}).forEach(function(k){
    if(k==='text')n.textContent=attrs[k];else if(k==='html')n.innerHTML=attrs[k];else n.setAttribute(k,attrs[k]);
  });
  (children||[]).forEach(function(c){if(c)n.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return n;
}
function btn(label,fn,cls){var b=el('button',{type:'button',class:'b '+(cls||'g'),text:label});b.addEventListener('click',fn);return b}
function field(label,placeholder,value,tag){
  var w=el('div',{}),l=el('label',{text:label}),i=el(tag||'input',{type:'text',placeholder:placeholder||''});
  if(value)i.value=value;w.append(l,i);return {wrap:w,input:i};
}
function note(parent,text){var n=el('div',{class:'msg',role:'status',text:text});parent.append(n);return n}
function copy(text,done){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done('Скопировано в буфер обмена.')},function(){fallback()})}
  else fallback();
  function fallback(){var t=el('textarea',{});t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();done(ok?'Скопировано в буфер обмена.':'Не удалось скопировать. Выдели текст вручную.')}
}
function dateNow(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var style=el('style',{text:`
#rg-studio{margin:18px 0 20px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 12px 35px rgba(0,0,0,.12)}
#rg-studio .rg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#rg-studio .rg-brand{font:800 22px Oswald,sans-serif;letter-spacing:.04em}
#rg-studio .rg-sub{font-size:13px;color:var(--muted);margin:3px 0 0}
#rg-studio .rg-tabs{display:flex;flex-direction:column;gap:7px;overflow:visible;padding:12px 0 8px}
#rg-studio .rg-tabs button{width:100%;white-space:normal;text-align:left;min-height:42px;padding:9px 12px}
#rg-studio .rg-tabs button.active{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#rg-studio .rg-view{padding-top:8px}
#rg-studio .rg-cards{display:grid;grid-template-columns:1fr;gap:10px}
#rg-studio .rg-tile{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg);text-align:left;min-width:0}
#rg-studio .rg-tile b{display:block;font:700 16px Oswald,sans-serif;margin:4px 0}
#rg-studio .rg-tile small{color:var(--muted);line-height:1.4}
#rg-studio .rg-kpi{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
#rg-studio .rg-kpi>div{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#rg-studio .rg-kpi strong{display:block;font:700 22px Oswald,sans-serif}
#rg-studio .rg-kpi small{color:var(--muted);font-size:11px}
#rg-studio input,#rg-studio textarea,#rg-studio select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:42px}

#rg-gen input:not([type]){width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:46px}
#rg-gen input[type=checkbox]{width:auto;min-height:0}
#rg-gen .chk{display:flex;gap:10px;align-items:center;font-weight:400}
#rg-gen .b.s{min-height:36px;padding:6px 12px;font-size:14px}
#rg-gen .b.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#rg-gen canvas{margin-top:14px}
#rg-gen [hidden]{display:none!important}
</style>
<script>
/* RG GEN: ребусы и силуэты на странице «Афиши и шаблоны» */
(function(){
'use strict';
var HTML="<h2>Генераторы ребусов и силуэтов</h2><p>Ребус из картинок и букв и силуэт машины: фон с фото убирается нейросетью. Всё считается в браузере.</p>\n<div class=\"tabs\" role=\"tablist\"><button class=\"b on\" data-t=\"rebus\" role=\"tab\">Ребус</button><button class=\"b g\" data-t=\"sil\" role=\"tab\">Силуэт</button></div>\n<section id=\"rebus\">\n<div class=\"gpanel\">\n<label for=\"rTitle\">Заголовок</label><input id=\"rTitle\" value=\"Разгадайте ребус\">\n<label for=\"rSub\">Подзаголовок</label><input id=\"rSub\" value=\"И получи приз!\">\n<div class=\"two\">\n<div><label for=\"rPal\">Цвет</label><select id=\"rPal\"></select></div>\n<div><label for=\"rSize\">Размер</label><select id=\"rSize\"></select></div>\n</div>\n<label for=\"rAns\">Ответ (для картинки с ответом)</label><input id=\"rAns\" placeholder=\"Например: Самосвал\">\n</div>\n<div id=\"tiles\"></div>\n<div class=\"row\">\n<button class=\"b g\" id=\"addImg\">+ Картинка</button>\n<button class=\"b g\" id=\"addTxt\">+ Буквы</button>\n<button class=\"b g\" id=\"addQ\">+ Знак «?»</button>\n</div>\n<canvas id=\"rCv\" role=\"img\" aria-label=\"Предпросмотр ребуса\"></canvas>\n<div class=\"row\"><button class=\"b\" id=\"rDl\">Скачать ребус</button><button class=\"b g\" id=\"rDlA\">Скачать с ответом</button></div>\n<div class=\"msg\" id=\"rMsg\" role=\"status\"></div>\n</section>\n\n<section id=\"sil\" hidden>\n<div class=\"gpanel\">\n<label for=\"sFile\">Фото машины, скина или предмета</label><input type=\"file\" id=\"sFile\" accept=\"image/*\">\n<p>Нейросеть вырежет машину с любого фона, даже с улицы. При первом запуске нужен интернет: модель скачивается один раз (десятки МБ) и дальше берётся из кэша браузера. Если она не загрузится, выберите режим «Однотонный» или «Прозрачный».</p>\n<div class=\"two\">\n<div><label for=\"sMode\">Фон фото</label><select id=\"sMode\"><option value=\"ai\" selected>Убрать любой фон (нейросеть)</option><option value=\"auto\">Определить сам</option><option value=\"alpha\">Прозрачный (PNG)</option><option value=\"color\">Однотонный, убрать по цвету</option></select></div>\n<div><label for=\"sBg\">Цвет фона фото</label><input type=\"color\" id=\"sBg\" value=\"#ffffff\"></div>\n</div>\n<label for=\"sTol\">Допуск цвета: <span id=\"sTolV\">40</span></label><input type=\"range\" id=\"sTol\" min=\"5\" max=\"150\" value=\"40\">\n<div class=\"row\" style=\"margin-top:6px\"><button class=\"b g s\" id=\"sCorner\">Взять цвет фона из угла</button></div>\n<label for=\"sTitle\">Заголовок</label><input id=\"sTitle\" value=\"Угадай машину по силуэту\">\n<label for=\"sSub\">Подзаголовок</label><input id=\"sSub\" value=\"И получи приз!\">\n<label for=\"sAns\">Ответ (для картинки с ответом)</label><input id=\"sAns\" placeholder=\"Например: BMW M5\">\n<div class=\"two\">\n<div><label for=\"sPal\">Цвет</label><select id=\"sPal\"></select></div>\n<div><label for=\"sSize\">Размер</label><select id=\"sSize\"></select></div>\n</div>\n<label for=\"sCol\">Цвет силуэта</label><input type=\"color\" id=\"sCol\" value=\"#000000\">\n<label class=\"chk\"><input type=\"checkbox\" id=\"sGlow\" checked>Светлая подсветка по контуру</label>\n</div>\n<canvas id=\"sCv\" role=\"img\" aria-label=\"Предпросмотр силуэта\"></canvas>\n<div class=\"row\"><button class=\"b\" id=\"sDl\">Скачать силуэт</button><button class=\"b g\" id=\"sDlA\">Скачать с ответом</button></div>\n<div class=\"msg\" id=\"sMsg\" role=\"status\">Загрузите фото, чтобы начать.</div>\n</section>\n";
function init(){
var R=document.getElementById('rg-gen');var $=function(s){return R.querySelector(s)};
function el(t,a,k){var n=document.createElement(t);for(var x in a||{}){if(x==='text')n.textContent=a[x];else n.setAttribute(x,a[x])}(k||[]).forEach(function(c){n.appendChild(typeof c==='string'?document.createTextNode(c):c)});return n}
var PAL={'Фиолетовый':['#8a1de8','#2e0a63'],'Красный':['#e5262d','#5c0c14'],'Синий':['#2c64c4','#0f2468'],'Бирюзовый':['#14a3a8','#0a3b4a'],'Тёмный':['#34283f','#09070c']};
var SZ=[['16:9 · 1920×1080',1920,1080],['Квадрат · 1080×1080',1080,1080],['4:5 · 1080×1350',1080,1350]];
['rPal','sPal'].forEach(function(id){Object.keys(PAL).forEach(function(k){$('#'+id).appendChild(el('option',{value:k,text:k}))})});
['rSize','sSize'].forEach(function(id){SZ.forEach(function(s,i){$('#'+id).appendChild(el('option',{value:i,text:s[0]}))})});

/* ---------- общее рисование ---------- */
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function txt(c,t,x,y,maxW,size,wt,fam,up,col,al){t=String(t||'');if(up)t=t.toUpperCase();var s=size;
  for(;s>10;s-=2){c.font=wt+' '+s+'px "'+fam+'",Arial,sans-serif';if(c.measureText(t).width<=maxW)break}
  c.textAlign=al||'center';c.textBaseline='middle';c.fillStyle=col;c.fillText(t,x,y)}
function base(c,W,H,pal,title,sub){
  var g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  var r=c.createRadialGradient(W/2,H*.55,0,W/2,H*.55,W*.6);r.addColorStop(0,'rgba(255,255,255,.2)');r.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=r;c.fillRect(0,0,W,H);

  [[W,0],[0,H]].forEach(function(p){[.2,.27,.34].forEach(function(k){c.beginPath();c.arc(p[0],p[1],Math.min(W,H)*k,0,7);c.stroke()})});
  txt(c,title,W/2,H*.12,W*.88,H*.095,'800 italic','Onest',true,'#fff');
  if(sub)txt(c,sub,W/2,H*.22,W*.7,H*.05,'500','Oswald',false,'rgba(255,255,255,.92)');
  txt(c,'BLACK RUSSIA',W*.03,H*.955,W*.4,H*.034,'800','Onest',false,'#fff','left');
  var pw=W*.14,ph=H*.055,px=W*.97-pw,py=H*.955-ph/2;rr(c,px,py,pw,ph,ph/2);c.fillStyle='rgba(255,255,255,.2)';c.fill();c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.6)';c.stroke();
  txt(c,'Surgut',px+pw/2,H*.955,pw*.8,ph*.6,'700','Onest',false,'#fff')}
function answer(c,W,H,a){if(!a)return;var w=W*.7,h=H*.085,x=(W-w)/2,y=H*.835;rr(c,x,y,w,h,h/2);c.fillStyle='rgba(0,0,0,.45)';c.fill();c.lineWidth=3;c.strokeStyle='#ffd54a';c.stroke();txt(c,'Ответ: '+a,W/2,y+h/2,w*.9,h*.55,'700','Oswald',false,'#fff')}
function cover(c,im,x,y,w,h){var iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,k=Math.max(w/iw,h/ih);c.save();rr(c,x,y,w,h,Math.min(w,h)*.08);c.clip();c.drawImage(im,x+(w-iw*k)/2,y+(h-ih*k)/2,iw*k,ih*k);c.restore()}
function save(cv,name,msg){cv.toBlob(function(b){if(!b){msg.textContent='Не удалось создать файл.';return}
  var f=new File([b],name,{type:'image/png'});
  if('ontouchstart' in window&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});msg.textContent='Откройте «Поделиться» и сохраните в Галерею или Файлы.';return}
  var u=URL.createObjectURL(b),a=el('a',{href:u,download:name});document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);msg.textContent='Файл скачан: '+name},'image/png')}
function loadImg(file,ok,bad){var u=URL.createObjectURL(file),i=new Image();i.onload=function(){URL.revokeObjectURL(u);ok(i)};i.onerror=function(){URL.revokeObjectURL(u);bad()};i.src=u}
var raf={};function soon(k,f){if(raf[k])return;raf[k]=requestAnimationFrame(function(){raf[k]=0;f()})}

/* ---------- РЕБУС ---------- */
var T=[{k:'img',sign:'+',l:0,r:0,cap:''},{k:'img',sign:'=',l:0,r:0,cap:''},{k:'q',sign:'',l:0,r:0,cap:''}];
var rcv=$('#rCv');
function tile(c,t,x,y,s){
  c.save();c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=s*.1;c.shadowOffsetY=s*.04;rr(c,x-s/2,y-s/2,s,s,s*.08);
  if(t.k==='img'){c.fillStyle='#fff'}else{var g=c.createLinearGradient(x,y-s/2,x,y+s/2);g.addColorStop(0,'#2b1d3d');g.addColorStop(1,'#120a1c');c.fillStyle=g}
  c.fill();c.restore();
  if(t.k==='img'){var p=s*.03;if(t.im)cover(c,t.im,x-s/2+p,y-s/2+p,s-2*p,s-2*p);else{rr(c,x-s/2+p,y-s/2+p,s-2*p,s-2*p,s*.06);c.fillStyle='#d9d2e3';c.fill();txt(c,'Фото',x,y,s*.7,s*.18,'500','Onest',true,'#7d6f90')}}
  else if(t.k==='q')txt(c,'?',x,y+s*.03,s*.8,s*.8,'800','Onest',false,'#ffd54a');
  else txt(c,t.txt||'АБВ',x,y,s*.86,s*.5,'800','Onest',true,'#fff');
  [['l',x-s/2],['r',x+s/2]].forEach(function(q){var n=t[q[0]];if(!n)return;var str=new Array(n+1).join(','),bw=s*.16*n+s*.14,bh=s*.2,bx=q[0]==='l'?q[1]-bw*.3:q[1]-bw*.7,by=y-s/2-bh*.5;
    rr(c,bx,by,bw,bh,bh/2);c.fillStyle='#ffd54a';c.fill();txt(c,str,bx+bw/2,by+bh*.38,bw,bh*1.1,'800','Onest',false,'#1a0f26')});
  if(t.cap)txt(c,t.cap,x,y+s/2+s*.14,s*1.3,s*.17,'700','Oswald',false,'#fff')}
function drawRebus(cv,ans){
  var S=SZ[+$('#rSize').value],W=S[1],H=S[2],pal=PAL[$('#rPal').value];cv.width=W;cv.height=H;var c=cv.getContext('2d');
  base(c,W,H,pal,$('#rTitle').value,$('#rSub').value);var n=T.length;
  if(n){var rows=n>4?2:1,cols=Math.ceil(n/rows),top=H*.3,aH=H*.52,cw=W*.94/cols,rh=aH/rows,s=Math.min(cw/1.4,rh*.7,380);
    T.forEach(function(t,i){var r=Math.floor(i/cols),q=i%cols,x=W*.03+cw*(q+.5)-s*.12,y=top+rh*(r+.5)-s*.04;tile(c,t,x,y,s);
      if(t.sign)txt(c,t.sign,x+s/2+(cw-s)*.38+s*.04,y,s*.5,s*.42,'800','Oswald',false,'#fff')})}
  if(ans)answer(c,W,H,$('#rAns').value.trim()||'—')}
function rRender(){drawRebus(rcv,false)}
function rList(){var box=$('#tiles');box.replaceChildren();
  T.forEach(function(t,i){var d=el('div',{'class':'tile'}),h=el('h3',{text:(i+1)+'. '+({img:'Картинка',txt:'Буквы',q:'Знак «?»'})[t.k]});d.appendChild(h);
    if(t.k==='img'){var f=el('input',{type:'file',accept:'image/*','aria-label':'Фото '+(i+1)});f.addEventListener('change',function(){if(f.files[0])loadImg(f.files[0],function(im){t.im=im;rRender()},function(){$('#rMsg').textContent='Не удалось прочитать файл.'})});d.append(el('label',{text:'Фото'}),f)}
    if(t.k==='txt'){var x=el('input',{value:t.txt||'','aria-label':'Буквы',placeholder:'Например: К, О, Т'});x.addEventListener('input',function(){t.txt=x.value;soon('r',rRender)});d.append(el('label',{text:'Буквы'}),x)}
    function sel(lab,key,opts){var s=el('select',{'aria-label':lab},opts.map(function(o){return el('option',{value:o[0],text:o[1]})}));s.value=String(t[key]);s.addEventListener('change',function(){t[key]=typeof opts[0][0]==='number'?+s.value:s.value;rRender()});return el('div',{},[el('label',{text:lab}),s])}
    var C=[[0,'нет'],[1,','],[2,',,'],[3,',,,']];
    d.append(el('div',{'class':'two'},[sel('Запятые слева (убрать первые буквы)','l',C),sel('Запятые справа (убрать последние буквы)','r',C)]));
    var cp=el('input',{value:t.cap,placeholder:'Например: 3 1 2','aria-label':'Подпись'});cp.addEventListener('input',function(){t.cap=cp.value;soon('r',rRender)});
    d.append(el('div',{'class':'two'},[el('div',{},[el('label',{text:'Подпись под картинкой'}),cp]),sel('Знак после','sign',[['','нет'],['+','+'],['−','−'],['=','='],[',',',']])]));
    var row=el('div',{'class':'row'});
    [['↑',-1],['↓',1]].forEach(function(m){var b=el('button',{type:'button','class':'b g s',text:m[0],'aria-label':m[1]<0?'Выше':'Ниже'});b.addEventListener('click',function(){var j=i+m[1];if(j<0||j>=T.length)return;var a=T.splice(i,1)[0];T.splice(j,0,a);rList();rRender()});row.appendChild(b)});
    var del=el('button',{type:'button','class':'b g s',text:'Удалить'});del.addEventListener('click',function(){T.splice(i,1);rList();rRender()});row.appendChild(del);d.appendChild(row);box.appendChild(d)})}
function addT(k){T.push({k:k,sign:'',l:0,r:0,cap:'',txt:''});rList();rRender()}
$('#addImg').addEventListener('click',function(){addT('img')});$('#addTxt').addEventListener('click',function(){addT('txt')});$('#addQ').addEventListener('click',function(){addT('q')});
['#rTitle','#rSub'].forEach(function(s){$(s).addEventListener('input',function(){soon('r',rRender)})});['#rPal','#rSize'].forEach(function(s){$(s).addEventListener('change',rRender)});
$('#rDl').addEventListener('click',function(){drawRebus(rcv,false);save(rcv,'rebus.png',$('#rMsg'))});
$('#rDlA').addEventListener('click',function(){drawRebus(rcv,true);save(rcv,'rebus-otvet.png',$('#rMsg'));setTimeout(rRender,400)});

/* ---------- СИЛУЭТ ---------- */
var SI=null,SIcut=null,SF=null,SM=null,scv=$('#sCv'),AIM=null;
function hex(h){var n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function cornerColor(d,w,h){var P=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]],a=[0,0,0];P.forEach(function(p){var i=(p[1]*w+p[0])*4;a[0]+=d[i];a[1]+=d[i+1];a[2]+=d[i+2]});return a.map(function(v){return Math.round(v/4)})}
function toHex(a){return '#'+a.map(function(v){return('0'+v.toString(16)).slice(-2)}).join('')}
function mkMask(){if(!SI)return;var SRC=$('#sMode').value==='ai'?SIcut:SI;if(!SRC)return;
  var iw=SRC.naturalWidth||SRC.width,ih=SRC.naturalHeight||SRC.height,k=Math.min(1,1100/Math.max(iw,ih)),w=Math.round(iw*k),h=Math.round(ih*k),o=document.createElement('canvas');o.width=w;o.height=h;
  var oc=o.getContext('2d');oc.drawImage(SRC,0,0,w,h);var id=oc.getImageData(0,0,w,h),d=id.data,m=new Uint8Array(w*h),mode=$('#sMode').value,i;
  var hasA=false;for(i=3;i<d.length;i+=4)if(d[i]<200){hasA=true;break}
  if(mode==='ai'||mode==='alpha'||(mode==='auto'&&hasA)){var th=mode==='ai'?110:40;for(i=0;i<m.length;i++)m[i]=d[i*4+3]>th?1:0}
  else{var bg=hex($('#sBg').value),tol=+$('#sTol').value*3,seen=new Uint8Array(w*h),st=[];
    function ok(p){var j=p*4;return Math.abs(d[j]-bg[0])+Math.abs(d[j+1]-bg[1])+Math.abs(d[j+2]-bg[2])<=tol}
    function push(p){if(!seen[p]&&ok(p)){seen[p]=1;st.push(p)}}
    for(var x=0;x<w;x++){push(x);push((h-1)*w+x)}for(var y=0;y<h;y++){push(y*w);push(y*w+w-1)}
    while(st.length){var p=st.pop(),px=p%w;if(px>0)push(p-1);if(px<w-1)push(p+1);if(p>=w)push(p-w);if(p<w*(h-1))push(p+w)}
    for(i=0;i<m.length;i++)m[i]=seen[i]?0:1}
  var x0=w,y0=h,x1=-1,y1=-1;for(i=0;i<m.length;i++)if(m[i]){var xx=i%w,yy=(i-xx)/w;if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}
  if(x1<0){SM=null;$('#sMsg').textContent='Силуэт не найден: увеличьте допуск или выберите другой режим.';sRender();return}
  var bw=x1-x0+1,bh=y1-y0+1,mc=document.createElement('canvas');mc.width=bw;mc.height=bh;var mx=mc.getContext('2d'),md=mx.createImageData(bw,bh);
  for(var yy2=0;yy2<bh;yy2++)for(var xx2=0;xx2<bw;xx2++){if(m[(yy2+y0)*w+xx2+x0]){var q=(yy2*bw+xx2)*4;md.data[q+3]=255}}
  mx.putImageData(md,0,0);
  var cc=document.createElement('canvas');cc.width=bw;cc.height=bh;var cx=cc.getContext('2d');cx.drawImage(o,x0,y0,bw,bh,0,0,bw,bh);cx.globalCompositeOperation='destination-in';cx.drawImage(mc,0,0);
  SM={mask:mc,pic:cc,w:bw,h:bh};$('#sMsg').textContent='Силуэт готов: '+bw+'×'+bh+' px.';sRender()}
function drawSil(cv,ans){
  var S=SZ[+$('#sSize').value],W=S[1],H=S[2],pal=PAL[$('#sPal').value];cv.width=W;cv.height=H;var c=cv.getContext('2d');
  base(c,W,H,pal,ans&&$('#sAns').value.trim()?'Это '+$('#sAns').value.trim():$('#sTitle').value,$('#sSub').value);
  if(!SM){txt(c,'Загрузите фото',W/2,H*.55,W*.6,H*.07,'500','Oswald',false,'rgba(255,255,255,.7)');return}
  var aw=W*.84,ah=H*.56,k=Math.min(aw/SM.w,ah/SM.h),w=SM.w*k,h=SM.h*k,x=(W-w)/2,y=H*.3+(ah-h)/2+H*.02;
  if(ans){c.save();c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=H*.03;c.shadowOffsetY=H*.012;c.drawImage(SM.pic,x,y,w,h);c.restore();return}
  var t=document.createElement('canvas');t.width=SM.w;t.height=SM.h;var tc=t.getContext('2d');tc.drawImage(SM.mask,0,0);tc.globalCompositeOperation='source-in';tc.fillStyle=$('#sCol').value;tc.fillRect(0,0,SM.w,SM.h);
  c.save();if($('#sGlow').checked){c.shadowColor='rgba(255,255,255,.55)';c.shadowBlur=H*.03}c.drawImage(t,x,y,w,h);c.restore()}
function sRender(){drawSil(scv,false)}
function runAI(){var msg=$('#sMsg'),f=SF;if(!f)return;msg.textContent='Загрузка нейросети… первый раз это может занять минуту.';
  if(!AIM)AIM=import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
  AIM.then(function(M){return M.removeBackground(f,{output:{format:'image/png'},progress:function(k,c,t){if(t)msg.textContent='Загрузка модели: '+Math.round(c/t*100)+'%'}})})
  .then(function(blob){msg.textContent='Вырезаю фон…';loadImg(blob,function(im){if(f!==SF)return;SIcut=im;mkMask()},function(){msg.textContent='Не удалось обработать результат.'})})
  .catch(function(){AIM=null;msg.textContent='Нейросеть не загрузилась (нужен интернет). Включён режим «Определить сам».';$('#sMode').value='auto';mkMask()})}
$('#sFile').addEventListener('change',function(){var f=this.files[0];if(!f)return;$('#sMsg').textContent='Обработка…';
  loadImg(f,function(im){SI=im;SIcut=null;SF=f;var iw=im.naturalWidth,ih=im.naturalHeight,k=Math.min(1,200/Math.max(iw,ih)),o=document.createElement('canvas');o.width=Math.max(1,Math.round(iw*k));o.height=Math.max(1,Math.round(ih*k));var oc=o.getContext('2d');oc.drawImage(im,0,0,o.width,o.height);
    $('#sBg').value=toHex(cornerColor(oc.getImageData(0,0,o.width,o.height).data,o.width,o.height));if($('#sMode').value==='ai')runAI();else mkMask()},function(){$('#sMsg').textContent='Не удалось прочитать файл. Попробуйте JPG или PNG.'})});

['#sTitle','#sSub'].forEach(function(s){$(s).addEventListener('input',function(){soon('s',sRender)})});['#sPal','#sSize','#sCol','#sGlow'].forEach(function(s){$(s).addEventListener('change',sRender)});

/* ---------- вкладки и шрифты ---------- */
R.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){
  R.querySelectorAll('.tabs button').forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.classList.toggle('g',!on)});
  $('#rebus').hidden=b.dataset.t!=='rebus';$('#sil').hidden=b.dataset.t!=='sil'})});

rList();all();
if(document.fonts&&document.fonts.load)Promise.all(['500 40px Oswald','700 40px Oswald','800 40px Onest','500 40px Onest'].map(function(f){return document.fonts.load(f,'Аб')})).then(all,all);
}

 var box=document.createElement('section');box.id='rg-gen';box.className='panel';box.innerHTML=HTML;
 var pz=document.getElementById('rg-puzzle'),pr=pg.querySelector('.promo');
 if(pz&&pz.parentNode===pg)pg.insertBefore(box,pz.nextSibling);else if(pr&&pr.parentNode===pg)pg.insertBefore(box,pr.nextSibling);else pg.appendChild(box);
 init()}

<script>
/* Генераторы: отдельные компактные карточки вместо общей панели.
   Вставить целиком перед </body>, после всех остальных скриптов. */
(function(){
'use strict';
var G=[
 ['rebus','Ребус — из картинок и букв','Картинки, запятые и буквы: игроки разгадывают слово','с картинками и ответом',['#8a1de8','#2e0a63'],'РАЗГАДАЙТЕ РЕБУС','И получи приз!'],
 ['sil','Силуэт — угадай машину по тени','Загрузи фото: фон вырежется, останется чёрный силуэт','с вырезкой фона',['#2c64c4','#0f2468'],'УГАДАЙ МАШИНУ ПО СИЛУЭТУ','И получи приз!'],
 ['puz','Загадка — перемешанный скриншот','Скриншот режется на фрагменты и перемешивается','из скриншота',['#e5262d','#5c0c14'],'УГАДАЙ ПО ФРАГМЕНТАМ','Собери картинку']
];
function el(t,a,k){var n=document.createElement(t);Object.keys(a||{}).forEach(function(x){if(x==='text')n.textContent=a[x];else n.setAttribute(x,a[x])});(k||[]).forEach(function(c){n.appendChild(c)});return n}
function fit(c,t,x,y,w,s,wt,fam,col,al){for(;s>8;s--){c.font=wt+' '+s+'px "'+fam+'",Arial,sans-serif';if(c.measureText(t).width<=w)break}c.textAlign=al||'center';c.textBaseline='middle';c.fillStyle=col;c.fillText(t,x,y)}
function box(c,x,y,w,h,r,f){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=f;c.fill()}

function thumb(cv,i){
  var W=480,H=270,c=cv.getContext('2d'),g=G[i],p=g[4];cv.width=W;cv.height=H;
  var gr=c.createLinearGradient(0,0,W,H);gr.addColorStop(0,p[0]);gr.addColorStop(1,p[1]);c.fillStyle=gr;c.fillRect(0,0,W,H);
  var rg=c.createRadialGradient(W/2,H*.55,0,W/2,H*.55,W*.6);rg.addColorStop(0,'rgba(255,255,255,.2)');rg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=rg;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(255,255,255,.16)';c.lineWidth=2;
  [[W,0],[0,H]].forEach(function(q){[54,72,92].forEach(function(r){c.beginPath();c.arc(q[0],q[1],r,0,7);c.stroke()})});
  fit(c,g[5],W/2,32,W*.88,26,'800 italic','Onest','#fff');
  fit(c,g[6],W/2,60,W*.7,14,'500','Oswald','rgba(255,255,255,.92)');
  fit(c,'BLACK RUSSIA',14,258,W*.4,10,'800','Onest','#fff','left');
  if(i===0){
    [105,240,375].forEach(function(x,j){
      box(c,x-42,113,84,84,9,j<2?'#fff':'#1d1229');
      if(j<2)box(c,x-36,119,72,72,6,'#d9d2e3');
      else fit(c,'?',x,158,60,70,'800','Onest','#ffd54a')});
    fit(c,'+',172,155,40,40,'800','Oswald','#fff');
    fit(c,'=',307,155,40,40,'800','Oswald','#fff');
  }else if(i===1){
    c.save();c.shadowColor='rgba(255,255,255,.55)';c.shadowBlur=10;c.fillStyle='#000';c.beginPath();
    [[100,200],[105,174],[168,160],[208,130],[300,130],[342,160],[385,170],[392,200]].forEach(function(q,j){c[j?'lineTo':'moveTo'](q[0],q[1])});
    c.closePath();c.fill();
    [[160,203],[340,203]].forEach(function(q){c.beginPath();c.arc(q[0],q[1],21,0,7);c.fill()});
    c.restore();
  }else{
    [3,7,1,5,0,8,4,2,6].forEach(function(q,j){
      box(c,161+(j%3)*54,78+Math.floor(j/3)*54,50,50,4,'hsl('+(q*40)+',60%,'+(38+q*3)+'%)')});
  }
}

function mount(){
  var R=document.getElementById('rg-gen'),Z=document.getElementById('rg-puzzle');
  if(!R||!Z||document.getElementById('rg-gens'))return;
  /* убираем общий заголовок, вкладки и дублирующие описания */
  Array.prototype.slice.call(R.children).forEach(function(n){if(n.tagName==='H2'||n.tagName==='P'||n.classList.contains('tabs'))n.remove()});
  Array.prototype.slice.call(Z.children).forEach(function(n){if(n.tagName==='H2'||n.tagName==='P')n.remove()});

  var grid=el('div',{'class':'grid'}),
    list=el('div',{},[el('h2',{text:'Генераторы'}),el('p',{text:'Выберите генератор: каждый открывается отдельно. Всё считается в браузере.'}),grid]),
    h1=el('h1'),pd=el('p'),
    back=el('button',{type:'button','class':'back',text:'← Все генераторы'}),
    view=el('div',{hidden:''},[back,h1,pd]),
    W=el('section',{id:'rg-gens','class':'hud'},[list,view]),cvs=[];
  R.parentNode.insertBefore(W,R);
  view.appendChild(R);view.appendChild(Z);R.hidden=true;Z.hidden=true;

  function open(i){
    var k=G[i][0],a=R.querySelector('#rebus'),s=R.querySelector('#sil');
    h1.textContent=G[i][1];pd.textContent=G[i][2];
    list.hidden=true;view.hidden=false;
    R.hidden=k==='puz';Z.hidden=k!=='puz';
    if(a)a.hidden=k!=='rebus';if(s)s.hidden=k!=='sil';
    W.scrollIntoView();
  }
  back.addEventListener('click',function(){view.hidden=true;list.hidden=false;W.scrollIntoView()});

  G.forEach(function(g,i){
    var cv=el('canvas',{role:'img','aria-label':'Превью генератора: '+g[1]}),
      b=el('button',{type:'button','class':'card'},[cv,
        el('i',{'class':'no','aria-hidden':'true',text:'№ 0'+(i+1)}),
        el('span',{text:g[1]}),el('small',{text:g[2]}),
        el('i',{'class':'feat',style:'font-style:normal',text:g[3]})]);
    b.addEventListener('click',function(){open(i)});
    grid.appendChild(b);cvs.push(cv);thumb(cv,i);
  });
  /* перерисовать превью, когда шрифты загрузятся */
  if(document.fonts&&document.fonts.load)Promise.all(['800 20px Onest','500 20px Oswald'].map(function(f){return document.fonts.load(f,'Аб')}))
    .then(function(){cvs.forEach(thumb)},function(){});
}

var app=document.getElementById('app');
if(app)new MutationObserver(function(){mount()}).observe(app,{childList:true,subtree:true});
mount();
})();
</script>
