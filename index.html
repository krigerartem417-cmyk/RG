<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Афиши Black Russia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Onest:wght@500;800&display=swap">
<style>
:root{--bg:#f3f0f7;--card:#fff;--ink:#241a33;--muted:#6b5f80;--line:#cfc4e0;--acc:#8a3fd1;--acc-ink:#fff;--danger:#d13f3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f1f;--card:#211733;--ink:#f1ebfa;--muted:#aa9cc4;--line:#3d2d59;--acc:#a869f0;--acc-ink:#14091f;--danger:#f06a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 28px/1.15 Oswald,Impact,sans-serif;margin:0 0 6px}
p{margin:0 0 12px;color:var(--muted)}
canvas{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#222}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ink);font:inherit}
.card .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#2a1f3a}
.card span{display:block;padding:10px 12px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px 18px;margin-top:16px}
label{display:block;margin:14px 0 6px;font-weight:500}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:46px}
textarea{resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button.b{font:500 15px Onest,sans-serif;border:0;border-radius:10px;padding:12px 18px;min-height:46px;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
button.b.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.b.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
button.b:disabled{opacity:.5;cursor:default}
.msg{min-height:22px;font-size:14px;color:var(--muted);margin-top:8px}
.msg.err{color:var(--danger)}
#fallback{display:none;margin-top:14px}#fallback img{width:100%;border-radius:12px}
.back{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0 0 12px}

/* drop-zone */
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);
  transition:border-color .15s,background .15s;cursor:pointer;position:relative}
.drop.over{border-color:var(--acc);background:rgba(138,63,209,.08)}
.drop .thumb{position:relative;display:inline-block;margin-top:10px}
.drop .thumb img{max-width:100%;max-height:140px;border-radius:8px;display:block}
.drop .thumb button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;
  border:0;background:var(--danger);color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0}
.drop input[type=file]{display:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
"use strict";
var app = document.getElementById('app');
var STORAGE_KEY = 'br_afishi_v1';

// ---------- полифилл roundRect ----------
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if (typeof r === 'number') r = [r,r,r,r];
    var rr = Math.min(r[0]||0, w/2, h/2);
    this.moveTo(x+rr, y);
    this.arcTo(x+w, y,   x+w, y+h, rr);
    this.arcTo(x+w, y+h, x,   y+h, rr);
    this.arcTo(x,   y+h, x,   y,   rr);
    this.arcTo(x,   y,   x+w, y,   rr);
    this.closePath();
    return this;
  };
}

// ---------- встроенные фоны ----------
var BGS = { /* ... те же base64, что и в исходнике ... */ };
// ВАЖНО: вставь сюда свои BGS из исходного файла (guess, skins, vote, note, fact).

// ---------- утилиты ----------
function h(tag,a,kids){
  var e=document.createElement(tag);
  for(var k in (a||{})){
    var v=a[k]; if(v==null) continue;
    if(k==='on'){ for(var ev in v) e.addEventListener(ev,v[ev]); }
    else if(k==='text') e.textContent=v;
    else if(k==='class') e.className=v;
    else e.setAttribute(k,v);
  }
  (kids||[]).forEach(function(c){
    if(c!=null) e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

function fitText(ctx,text,fontTpl,cx,cy,maxW,maxH,start,min,lh,color,align){
  var s=start,L=[],ws=String(text||'').split(/\s+/).filter(Boolean),cur='';
  for(;s>=min;s-=2){
    ctx.font=fontTpl.replace('{s}',s);
    L=[];cur='';
    ws.forEach(function(w){
      var t=cur?cur+' '+w:w;
      if(ctx.measureText(t).width>maxW&&cur){L.push(cur);cur=w}else cur=t;
    });
    if(cur)L.push(cur);
    if(L.length*s*lh<=maxH && L.every(function(l){return ctx.measureText(l).width<=maxW})) break;
  }
  ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  var y0=cy-(L.length-1)*s*lh/2;
  L.forEach(function(l,i){ctx.fillText(l,cx,y0+i*s*lh)});
}

function cover(ctx,img,x,y,w,hh){
  var r=Math.max(w/img.width,hh/img.height),iw=img.width*r,ih=img.height*r;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,hh);ctx.clip();
  ctx.drawImage(img,x+(w-iw)/2,y+(hh-ih)/2,iw,ih);ctx.restore();
}

function readImg(file, ok, fail){
  if(!file){ fail && fail('Файл не выбран'); return; }
  if(!/^image\//.test(file.type)){ fail && fail('Это не изображение'); return; }
  var r=new FileReader();
  r.onerror=function(){ fail && fail('Не удалось прочитать файл'); };
  r.onload=function(){
    var i=new Image();
    i.onload=function(){ ok(i); };
    i.onerror=function(){ fail && fail('Битый файл изображения'); };
    i.src=r.result;
  };
  r.readAsDataURL(file);
}

function loadImg(src){
  return new Promise(function(res,rej){
    if(!src) return res(null);
    var i=new Image();
    i.onload=function(){res(i)};
    i.onerror=function(){rej(new Error('img'))};
    i.src=src;
  });
}

// ---------- хранилище ----------
function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(st){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }catch(e){}
}

// ---------- шаблоны (draw принимает ctx первым аргументом) ----------
var T_GUESS = {
  id:'guess', name:'Угадай (3 фото)', bgKey:'guess', w:1920, h:1080,
  fields:[
    {k:'title',t:'text',label:'Заголовок',def:'УГАДАЙ МАШИНЫ ПО ФАРЕ'},
    {k:'sub',t:'text',label:'Подзаголовок',def:'И ПОЛУЧИ ПРИЗ!'},
    {k:'img1',t:'image',label:'Фото 1'},{k:'img2',t:'image',label:'Фото 2'},{k:'img3',t:'image',label:'Фото 3'}
  ],
  draw:function(ctx,v,im){
    var poses=[[80,380,520,560],[700,420,520,520],[1320,380,520,560]];
    poses.forEach(function(p,i){
      var x=p[0],y=p[1],w=p[2],hh=p[3];
      ctx.save(); ctx.beginPath(); ctx.roundRect(x,y,w,hh,30); ctx.clip();
      if(im['img'+(i+1)]) cover(ctx,im['img'+(i+1)],x,y,w,hh);
      else { ctx.fillStyle='#1a2342'; ctx.fillRect(x,y,w,hh); }
      ctx.restore();
    });
    fitText(ctx,v.title.toUpperCase(),'italic 800 {s}px Onest',960,150,1700,150,160,50,1,'#fff');
    fitText(ctx,v.sub.toUpperCase(),'italic 800 {s}px Onest',960,290,500,80,60,20,1,'#fff');
  }
};

var T_SKINS = {
  id:'skins', name:'Битва (2 фото)', bgKey:'skins', w:1920, h:1080,
  fields:[
    {k:'title',t:'text',label:'Заголовок',def:'БИТВА МАШИН'},
    {k:'vs',t:'text',label:'Надпись в центре',def:'VS'},
    {k:'img1',t:'image',label:'Фото 1'},{k:'img2',t:'image',label:'Фото 2'}
  ],
  draw:function(ctx,v,im){
    var poses=[[200,250,450,600],[1270,250,450,600]];
    poses.forEach(function(p,i){
      var x=p[0],y=p[1],w=p[2],hh=p[3];
      ctx.save(); ctx.beginPath(); ctx.roundRect(x,y,w,hh,16); ctx.clip();
      if(im['img'+(i+1)]) cover(ctx,im['img'+(i+1)],x,y,w,hh);
      else { ctx.fillStyle='#2a3b3c'; ctx.fillRect(x,y,w,hh); }
      ctx.restore();
    });
    fitText(ctx,v.title.toUpperCase(),'italic 800 {s}px Onest',960,130,1130,170,175,40,1,'#11d4c2');
    fitText(ctx,v.vs.toUpperCase(),'italic 800 {s}px Onest',960,550,520,300,340,80,1,'#11d4c2');
  }
};

var T_VOTE = {
  id:'vote', name:'Голосование (4 фото)', bgKey:'vote', w:1920, h:1080,
  fields:[
    {k:'txt1',t:'text',label:'Текст 1',def:'ОТ ТВОЕГО ЛАЙКА ЗАВИСИТ'},
    {k:'txt2',t:'text',label:'Текст 2',def:'ТВОЙ СКИН НА BLACK RUSSIA'},
    {k:'img1',t:'image',label:'Фото 1'},{k:'n1',t:'text',label:'Номер 1',def:'0-2'},
    {k:'img2',t:'image',label:'Фото 2'},{k:'n2',t:'text',label:'Номер 2',def:'3-5'},
    {k:'img3',t:'image',label:'Фото 3'},{k:'n3',t:'text',label:'Номер 3',def:'6-7'},
    {k:'img4',t:'image',label:'Фото 4'},{k:'n4',t:'text',label:'Номер 4',def:'7-9'}
  ],
  draw:function(ctx,v,im){
    var poses=[[640,20,480,300],[1230,50,480,300],[640,390,480,300],[1230,420,480,300]];
    poses.forEach(function(p,i){
      var x=p[0],y=p[1],w=p[2],hh=p[3];
      ctx.save();
      ctx.translate(x+w/2, y+hh/2);
      ctx.rotate((i===0||i===3)?-0.04:0.03);
      ctx.fillStyle='#fff'; ctx.fillRect(-w/2-10,-hh/2-10,w+20,hh+20);
      ctx.save(); ctx.beginPath(); ctx.rect(-w/2,-hh/2,w,hh); ctx.clip();
      if(im['img'+(i+1)]) cover(ctx,im['img'+(i+1)],-w/2,-hh/2,w,hh);
      else { ctx.fillStyle='#333'; ctx.fillRect(-w/2,-hh/2,w,hh); }
      ctx.restore();
      ctx.fillStyle='#fff'; ctx.fillRect(-w/2-10,hh/2-30,120,50);
      fitText(ctx,v['n'+(i+1)],'italic 800 {s}px Onest',-w/2+50,hh/2-5,80,40,30,14,1,'#000');
      ctx.restore();
    });
    fitText(ctx,v.txt1.toUpperCase(),'italic 500 {s}px Onest',300,880,600,80,60,20,1,'#fff','left');
    fitText(ctx,v.txt2.toUpperCase(),'italic 800 {s}px Onest',300,960,800,80,70,20,1,'#e52b2b','left');
  }
};

var T_NOTE = {
  id:'note', name:'Мнение / Блокнот', bgKey:'note', w:1000, h:1200,
  fields:[
    {k:'q',t:'area',label:'Текст на блокноте',def:'КАКУЮ РУБРИКУ ВЫ БЫ ХОТЕЛИ УВИДЕТЬ В НАШЕМ СООБЩЕСТВЕ?'}
  ],
  draw:function(ctx,v){
    ctx.save();
    ctx.translate(440,680); ctx.rotate(-0.06);
    fitText(ctx,v.q.toUpperCase(),'italic 800 {s}px Onest',0,0,320,400,50,18,1.1,'#111');
    ctx.restore();
  }
};

var T_FACT = {
  id:'fact', name:'Интересный факт', bgKey:'fact', w:1920, h:1080,
  fields:[
    {k:'title',t:'text',label:'Заголовок',def:'ИНТЕРЕСНЫЙ ФАКТ'},
    {k:'cardTitle',t:'text',label:'Заголовок плашки',def:'Жалобы на игроков'},
    {k:'cardSub',t:'text',label:'Подзаголовок плашки',def:'Посмотреть правила подачи жалоб'},
    {k:'cardStat',t:'text',label:'Статистика',def:'Темы 4,6К   Сообщения 13,9К'},
    {k:'factText',t:'area',label:'Основной текст',def:'ЗА ИСТОРИЮ НАШЕГО СЕРВЕРА, АДМИНИСТРАЦИЕЙ БЫЛО ПРОВЕРЕНО БОЛЕЕ 4,5 ТЫСЯЧ ЖАЛОБ НА ИГРОКОВ!'}
  ],
  draw:function(ctx,v){
    fitText(ctx,v.title.toUpperCase(),'italic 800 {s}px Onest',960,200,1200,150,160,50,1,'#fff');
    ctx.save(); ctx.translate(960,480);
    ctx.fillStyle='#2e2b36'; ctx.beginPath(); ctx.roundRect(-650,-180,1300,320,40); ctx.fill();
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='italic 800 60px Onest'; ctx.fillStyle='#fff'; ctx.fillText(v.cardTitle,-400,-80);
    ctx.font='400 40px Onest'; ctx.fillStyle='#ccc'; ctx.fillText(v.cardSub,-400,0);
    ctx.font='400 35px Onest'; ctx.fillStyle='#888'; ctx.fillText(v.cardStat,-400,80);
    ctx.restore();
    fitText(ctx,v.factText.toUpperCase(),'italic 500 {s}px Onest',960,850,1600,180,60,25,1.1,'#fff');
  }
};

var TEMPLATES=[T_GUESS,T_SKINS,T_VOTE,T_NOTE,T_FACT];

// ---------- главный экран ----------
function home(){
  app.replaceChildren(
    h('h1',{text:'Афиши Black Russia'}),
    h('p',{text:'Выберите шаблон, поменяйте текст или картинку и скачайте готовую афишу.'}),
    h('div',{class:'grid'}, TEMPLATES.map(function(t){
      return h('button',{class:'card',on:{click:function(){use(t)}}},[
        h('img',{class:'ph',src:BGS[t.bgKey],alt:t.name}),
        h('span',{text:t.name})
      ]);
    }))
  );
}

// ---------- редактор ----------
function use(t){
  var state = loadState();
  var saved = (state[t.id] && state[t.id].values) || {};
  var v={}, im={};
  t.fields.forEach(function(f){ v[f.k] = (f.k in saved) ? saved[f.k] : f.def; });

  var cv = h('canvas');
  var ctx = cv.getContext('2d');
  var msg = h('div',{class:'msg'});
  var fb = h('div',{id:'fallback'},[
    h('p',{text:'Если скачивание не началось — нажмите на картинку и удерживайте, чтобы сохранить.'}),
    h('img',{alt:'Готово'})
  ]);

  var bgImg = null;
  var bgPromise = loadImg(BGS[t.bgKey]).then(function(i){ bgImg = i; }, function(){ bgImg = null; });

  var repaint = function(){
    cv.width = t.w; cv.height = t.h;
    if(bgImg && bgImg.naturalWidth>0) ctx.drawImage(bgImg,0,0,t.w,t.h);
    else { ctx.fillStyle='#333'; ctx.fillRect(0,0,t.w,t.h); }
    t.draw(ctx, v, im);
  };

  var persist = function(){
    var st = loadState();
    st[t.id] = st[t.id] || {};
    // сохраняем только текстовые поля (картинки слишком тяжёлые для localStorage)
    st[t.id].values = {};
    t.fields.forEach(function(f){
      if(f.t!=='image') st[t.id].values[f.k] = v[f.k];
    });
    saveState(st);
  };

  // ---- форма ----
  var form = h('div',{class:'panel'});
  t.fields.forEach(function(f){
    var inp, wrap;
    if(f.t === 'image'){
      var thumb = h('div',{class:'thumb'});
      var dz = h('div',{class:'drop',tabindex:'0'},[
        h('div',{class:'hint',text:'Перетащите фото сюда или нажмите для выбора'}),
        thumb
      ]);
      var fileInp = h('input',{type:'file',accept:'image/*'});
      dz.appendChild(fileInp);

      var setThumb = function(){
        thumb.replaceChildren();
        if(im[f.k]){
          thumb.appendChild(h('img',{src: im[f.k].src}));
          thumb.appendChild(h('button',{type:'button',text:'×',title:'Удалить фото',on:{click:function(e){
            e.stopPropagation();
            im[f.k]=null; setThumb(); repaint();
          }}}));
        }
      };

      var handle = function(file){
        if(!file) return;
        msg.textContent='Читаю файл…'; msg.className='msg';
        dz.appendChild(h('span',{class:'spinner'}));
        readImg(file, function(img){
          im[f.k]=img; setThumb(); repaint();
          msg.textContent=''; dz.querySelectorAll('.spinner').forEach(function(s){s.remove();});
        }, function(err){
          msg.textContent=err; msg.className='msg err';
          dz.querySelectorAll('.spinner').forEach(function(s){s.remove();});
        });
      };

      dz.addEventListener('click', function(){ fileInp.click(); });
      dz.addEventListener('keydown', function(e){
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileInp.click(); }
      });
      fileInp.addEventListener('change', function(){ handle(fileInp.files[0]); fileInp.value=''; });
      ['dragenter','dragover'].forEach(function(ev){
        dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('over'); });
      });
      ['dragleave','drop'].forEach(function(ev){
        dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('over'); });
      });
      dz.addEventListener('drop', function(e){
        handle(e.dataTransfer.files && e.dataTransfer.files[0]);
      });

      form.appendChild(h('label',{text:f.label}));
      form.appendChild(dz);
    } else {
      inp = h(f.t==='area'?'textarea':'input',{type:'text',rows:f.t==='area'?'3':null});
      inp.value = v[f.k];
      inp.addEventListener('input', function(){ v[f.k]=inp.value; repaint(); persist(); });
      form.appendChild(h('label',{text:f.label}));
      form.appendChild(inp);
    }
  });

  // ---- кнопки ----
  var downloadBtn = h('button',{class:'b',text:'Скачать PNG',on:{click:function(){
    if(!(bgImg && bgImg.naturalWidth>0)){
      msg.textContent='Фон ещё загружается, подождите…'; msg.className='msg';
      return;
    }
    downloadBtn.disabled = true;
    var restore = function(){ downloadBtn.disabled = false; };

    var saveDataUrl = function(url){
      fb.querySelector('img').src = url;
      fb.style.display = 'block';
      var a = document.createElement('a');
      a.href = url;
      a.download = t.name + '.png';
      document.body.appendChild(a); a.click(); a.remove();
    };

    var finish = function(blob){
      if(blob){
        var u = URL.createObjectURL(blob);
        saveDataUrl(u);
        setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
      } else {
        saveDataUrl(cv.toDataURL('image/png'));
      }
      msg.textContent='Готово! Если файл не скачался — сохраните картинку ниже.';
      msg.className='msg';
      restore();
    };

    try{
      if(cv.toBlob) cv.toBlob(finish, 'image/png');
      else finish(null);
    }catch(err){
      msg.textContent='Ошибка рендеринга: '+err.message; msg.className='msg err';
      restore();
    }
  }}});

  var resetBtn = h('button',{class:'b ghost',text:'Сбросить',on:{click:function(){
    if(!confirm('Вернуть все поля и фото к значениям по умолчанию?')) return;
    t.fields.forEach(function(f){
      if(f.t==='image'){ im[f.k]=null; }
      else { v[f.k]=f.def; }
    });
    // перерисовываем форму целиком, проще чем синхронизировать поля
    use(t);
  }}});

  app.replaceChildren(
    h('button',{class:'back',text:'← Назад',on:{click:home}}),
    h('h1',{text:t.name}),
    cv,
    h('div',{class:'row'},[downloadBtn, resetBtn]),
    msg, fb, form
  );

  // первая отрисовка после загрузки фона
  repaint();
  bgPromise.then(repaint);
}

home();
})();
</script>
</body>
</html>
