<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Редакция SURGUT — временно недоступно</title>
<meta name="theme-color" content="#0b0608">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c0242f'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='24' font-weight='800' fill='white' text-anchor='middle'%3ESR%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0608;--card:#170c10;--ink:#f3eaec;--muted:#b9a3a8;
  --line:#43202a;--acc:#c0242f;--deco:rgba(170,40,52,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:500 16px/1.55 Onest,system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:24px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100dvh;
  background:
    radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%),
    linear-gradient(180deg,#0a0507 0%,#1a0a10 55%,#2b0e16 100%);
}
.card{
  width:100%;max-width:460px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;
  padding:32px 26px 28px;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px);
}
.code{
  font:800 72px/1 Oswald,Impact,sans-serif;color:var(--acc);
  letter-spacing:.02em;text-shadow:0 4px 30px var(--deco);
  position:relative;z-index:1;
}
h1{
  font:700 22px/1.25 Oswald,Impact,sans-serif;
  margin:14px 0 10px;position:relative;z-index:1;
}
p{
  margin:0 0 8px;color:var(--muted);font-size:15px;
  position:relative;z-index:1;
}
.meta{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin:16px 0 20px;position:relative;z-index:1;
}
.tag{
  font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.12em;text-transform:uppercase;
  padding:6px 10px;border:1px solid var(--line);border-radius:999px;
  color:var(--muted);
}
.retry{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;
  border:0;border-radius:12px;padding:14px 24px;min-height:48px;
  background:var(--acc);color:#fff;cursor:pointer;
  font:700 15px Onest,system-ui,sans-serif;
  box-shadow:inset 0 0 16px rgba(255,255,255,.14);
  transition:transform .12s ease,filter .2s ease;
}
.retry:hover{filter:brightness(1.08)}
.retry:active{transform:scale(.98)}
.retry:focus-visible{outline:3px solid #fff;outline-offset:3px}
.retry[disabled]{opacity:.7;cursor:progress}
.spinner{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:spin .8s linear infinite;display:none;
}
.retry.loading .spinner{display:inline-block}
.retry.loading .txt{opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
.note{
  margin-top:18px;font-size:13px;color:var(--muted);
  position:relative;z-index:1;
}
.note a{color:#ff9aa2;text-underline-offset:3px}
.footer{
  margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
  font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.16em;color:var(--muted);opacity:.7;
  position:relative;z-index:1;
}
#log{
  margin-top:16px;padding:10px 12px;border:1px dashed var(--line);
  border-radius:10px;text-align:left;
  font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#e0a0a6;background:rgba(0,0,0,.25);
  max-height:120px;overflow:auto;white-space:pre-wrap;
  display:none;position:relative;z-index:1;
}
#log.show{display:block}
@media (prefers-reduced-motion:reduce){
  .spinner{animation:none}
  .retry{transition:none}
}
</style>
</head>
<body>

<main class="card" role="alert" aria-live="assertive">
  <div class="code" aria-hidden="true">503</div>
  <h1>Сайт временно недоступен</h1>
  <p>Не удалось загрузить данные редакции. Сервис перегружен или проходит техническое обслуживание.</p>

  <div class="meta" aria-hidden="true">
    <span class="tag">service unavailable</span>
    <span class="tag">retry: auto</span>
    <span class="tag">SURGUT / BR</span>
  </div>

  <button class="retry" id="retry" type="button">
    <span class="spinner" aria-hidden="true"></span>
    <span class="txt">Попробовать снова</span>
  </button>

  <p class="note">
    Если ошибка повторяется — напишите
    <a href="https://vk.com/id676733241" target="_blank" rel="noopener noreferrer">во ВКонтакте</a>.
  </p>

  <div id="log" aria-live="polite"></div>

  <div class="footer" aria-hidden="true">REDAKCIYA-SURGUT / MAINTENANCE</div>
</main>

<script>
(function(){
'use strict';

var btn   = document.getElementById('retry');
var log   = document.getElementById('log');
var ATTEMPT_KEY = 'br-broken-attempts';

/* --- сколько раз уже пытались (чтобы не было бесконечного редиректа) --- */
function getAttempts(){
  try{ return parseInt(sessionStorage.getItem(ATTEMPT_KEY) || '0', 10) || 0; }
  catch(e){ return 0; }
}
function setAttempts(n){
  try{ sessionStorage.setItem(ATTEMPT_KEY, String(n)); }catch(e){}
}

/* --- псевдо-ошибки в консоли, чтобы страница выглядела «настоящей» --- */
function fakeErrors(){
  console.error('GET /api/content 503 (Service Unavailable)');
  console.error('RG Studio: init aborted — upstream timeout after 10000ms');
  console.error('Uncaught (in promise) Error: Failed to fetch');
}

/* --- лог на странице (появляется после второй попытки) --- */
function pushLog(line){
  log.classList.add('show');
  log.textContent += (log.textContent ? '\n' : '') + line;
  log.scrollTop = log.scrollHeight;
}

/* --- «проверка сервиса»: всегда неуспех, но выглядит правдоподобно --- */
function checkService(){
  return new Promise(function(resolve){
    setTimeout(function(){ resolve(false); }, 1200);
  });
}

/* --- имитация перезагрузки --- */
function retry(){
  if(btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('loading');

  var n = getAttempts() + 1;
  setAttempts(n);

  pushLog('[' + new Date().toLocaleTimeString('ru-RU') + '] retry #' + n + ' → GET /api/content');
  fakeErrors();

  checkService().then(function(ok){
    if(ok){
      /* сюда попасть нельзя — заглушка всегда возвращает false */
      location.reload();
      return;
    }
    pushLog('[' + new Date().toLocaleTimeString('ru-RU') + '] 503 Service Unavailable');

    /* после 3 попыток просто перезагружаем страницу (пользователь снова увидит 503) */
    if(n >= 3){
      pushLog('resetting client state…');
      setAttempts(0);
      setTimeout(function(){ location.reload(); }, 900);
      return;
    }

    btn.disabled = false;
    btn.classList.remove('loading');
  });
}

btn.addEventListener('click', retry);

/* --- клавиатура: Enter/Space уже работают через <button> --- */
/* --- авто-повтор через 30 секунд, чтобы страница «жила» --- */
setTimeout(function(){
  if(!document.hidden) retry();
}, 30000);

/* --- фиксируем первый заход в консоли --- */
fakeErrors();
pushLog('[' + new Date().toLocaleTimeString('ru-RU') + '] 503 Service Unavailable — content API offline');

/* --- если пользователь вернулся по кэшу, всё равно показываем ошибку --- */
window.addEventListener('pageshow', function(e){
  if(e.persisted){
    btn.disabled = false;
    btn.classList.remove('loading');
    pushLog('[' + new Date().toLocaleTimeString('ru-RU') + '] restored from bfcache — still offline');
  }
});

})();
</script>
</body>
</html>
