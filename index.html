<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Генератор постов — Black Russia Surgut</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&family=Roboto+Condensed:ital,wght@0,700;1,700&display=swap">
<style>
:root{--bg:#f6f6f7;--card:#fff;--tx:#18181b;--mut:#71717a;--bd:#e4e4e7;--ac:#f26200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111113;--card:#1c1c1f;--tx:#f4f4f5;--mut:#a1a1aa;--bd:#2e2e33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:18px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label,.row{font-size:13px;color:var(--mut)}label{display:block;margin:10px 0 4px}.row{display:flex;justify-content:space-between}
textarea,input[type=text]{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx)}
textarea{height:90px}input[type=range]{width:100%;accent-color:var(--ac)}
canvas{width:100%;height:auto;border-radius:10px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips button{flex:none;width:auto;padding:9px 14px;border-radius:20px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font:500 14px system-ui}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#d{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 16px system-ui}
.sl{border-top:1px solid var(--bd);margin-top:12px;padding-top:4px}</style></head><body><main>
<h1>Генератор постов Surgut</h1><div class="chips" id="ch"></div><div class="card" id="f" style="margin-top:12px"></div>
<div class="card"><canvas id="c"></canvas></div><button id="d">Скачать PNG</button><p id="m" style="font-size:13px;color:var(--mut)"></p>
</main><script>
const TPL=[{"id": "know", "name": "А вы знали?", "w": 2036, "h": 2696, "bg": "know.jpg", "fg": null, "slots": [], "texts": [{"type": "box", "label": "Текст", "v": "Интерьер СМИ не обновлялся с момента выхода игры.", "X": 990, "Y": 1625, "W": 1480, "H": 1000, "font": "italic 800 @px Montserrat", "color": "#fff", "max": 150, "lh": 1.12}]}, {"id": "repeat", "name": "Повтори фото", "w": 1576, "h": 957, "bg": "repeat.jpg", "fg": null, "slots": [{"r": [338, 271, 901, 521], "rad": 40, "bw": 9, "bc": "#000"}], "texts": [{"type": "line", "label": "Приз", "v": "100.000 ИВ", "x": 784, "y": 843, "rot": 0, "align": "center", "base": "middle", "size": 68, "maxW": 380, "font": "italic 700 @px 'Roboto Condensed'", "color": "#fff"}]}, {"id": "lights", "name": "Угадай машины по фаре", "w": 1920, "h": 1080, "bg": "lights.jpg", "fg": null, "texts": [], "slots": [{"r": [84, 390, 537, 480], "rad": 48, "bw": 3, "bc": "#7b2cbf"}, {"r": [697, 441, 511, 480], "rad": 48, "bw": 3, "bc": "#7b2cbf"}, {"r": [1309, 359, 537, 478], "rad": 48, "bw": 3, "bc": "#7b2cbf"}]}, {"id": "interior", "name": "Угадай интерьер", "w": 1781, "h": 1057, "bg": "interior.jpg", "fg": null, "texts": [], "slots": [{"r": [241, 208, 1299, 729], "rad": 52, "bw": 0, "bc": "#fff"}]}, {"id": "skin", "name": "Лайк: твой скин", "w": 1920, "h": 1080, "bg": "skin.jpg", "fg": "skin-fg.png", "slots": [{"q": [[735, 38], [1332, 52], null, [697, 378]], "rad": 0, "bw": 9, "bc": "#fff"}, {"q": [[1402, 70], [1898, 82], null, [1368, 352]], "rad": 0, "bw": 9, "bc": "#fff"}, {"q": [[722, 457], [1350, 470], null, [678, 815]], "rad": 0, "bw": 9, "bc": "#fff"}, {"q": [[1432, 462], [1912, 478], null, [1396, 770]], "rad": 0, "bw": 9, "bc": "#fff"}], "texts": [{"type": "line", "label": "Нижняя надпись", "v": "ТВОЙ СКИН НА BLACK RUSSIA", "x": 38, "y": 1046, "rot": -2.5, "align": "left", "base": "alphabetic", "size": 86, "maxW": 1100, "font": "700 @px 'Roboto Condensed'", "color": "#e32a2f"}]}, {"id": "car", "name": "Лайк: твоя машина", "w": 1920, "h": 1080, "bg": "car.jpg", "fg": "car-fg.png", "slots": [{"q": [[770, 33], [1382, 47], null, [733, 390]], "rad": 0, "bw": 9, "bc": "#fff"}, {"q": [[1407, 80], [1920, 95], null, [1375, 395]], "rad": 0, "bw": 9, "bc": "#fff"}, {"q": [[740, 455], [1368, 470], null, [697, 810]], "rad": 0, "bw": 9, "bc": "#fff"}, {"q": [[1418, 522], [1908, 535], null, [1385, 842]], "rad": 0, "bw": 9, "bc": "#fff"}], "texts": [{"type": "line", "label": "Нижняя надпись", "v": "ТВОЯ МАШИНА НА BLACK RUSSIA", "x": 28, "y": 1050, "rot": -2.6, "align": "left", "base": "alphabetic", "size": 100, "maxW": 1210, "font": "italic 700 @px 'Roboto Condensed'", "color": "#c8161d"}]}];
window.onerror=(m)=>{document.getElementById('m').textContent='Ошибка: '+m};
const c=document.getElementById('c'),x=c.getContext('2d');let cur=0;
const ST=TPL.map(t=>({tx:t.texts.map(a=>({v:a.v,s:a.max||0})),sl:t.slots.map(()=>({img:null,z:1,px:0,py:0}))}));
TPL.forEach(t=>{t._bg=new Image();t._bg.onload=draw;t._bg.onerror=()=>{document.getElementById('m').textContent='Не найден файл '+t.bg+' — загрузи картинки рядом с index.html'};t._bg.src=t.bg;if(t.fg){t._fg=new Image();t._fg.onload=draw;t._fg.src=t.fg}});
function fit(t,v,s0,W,H,lh){let L,sz=s0;for(;sz>20;sz-=2){x.font=t.font.replace('@',sz+'px');L=[];
 for(const p of v.split('\n')){let l='';for(const w of p.split(/\s+/).filter(Boolean)){const n=l?l+' '+w:w;if(x.measureText(n).width>W&&l){L.push(l);l=w}else l=n}L.push(l)}
 if(L.length*sz*lh<=H&&L.every(l=>x.measureText(l).width<=W))break}return[L,sz]}
function slot(s,o){x.save();let TL,TR,BL;if(s.r){TL=[s.r[0],s.r[1]];TR=[s.r[0]+s.r[2],s.r[1]];BL=[s.r[0],s.r[1]+s.r[3]]}else{TL=s.q[0];TR=s.q[1];BL=s.q[3]}
 const a=[TR[0]-TL[0],TR[1]-TL[1]],b=[BL[0]-TL[0],BL[1]-TL[1]],w=Math.hypot(...a),h=Math.hypot(...b),k=s.bw;
 x.setTransform(a[0]/w,a[1]/w,b[0]/h,b[1]/h,TL[0],TL[1]);
 if(k){x.beginPath();x.roundRect(0,0,w,h,s.rad);x.fillStyle=s.bc;x.fill()}
 x.beginPath();x.roundRect(k,k,w-2*k,h-2*k,Math.max(s.rad-k,0));x.clip();
 const vw=w-2*k,vh=h-2*k,iw=o.img.width,ih=o.img.height,sc=Math.max(vw/iw,vh/ih)*o.z,dw=iw*sc,dh=ih*sc;
 x.drawImage(o.img,k+(vw-dw)/2+o.px*(dw-vw)/2,k+(vh-dh)/2+o.py*(dh-vh)/2,dw,dh);x.restore()}
function draw(){const t=TPL[cur],S=ST[cur];if(!t._bg.complete||!t._bg.naturalWidth)return;
 c.width=t.w;c.height=t.h;x.drawImage(t._bg,0,0);
 t.slots.forEach((s,i)=>{if(S.sl[i].img)slot(s,S.sl[i])});
 if(t._fg&&t._fg.complete)x.drawImage(t._fg,0,0);
 t.texts.forEach((t2,i)=>{const v=S.tx[i].v.trim();if(!v)return;x.save();x.fillStyle=t2.color;
  if(t2.type=='box'){const[L,sz]=fit(t2,v,S.tx[i].s,t2.W,t2.H,t2.lh);x.textAlign='center';x.textBaseline='middle';const lh=sz*t2.lh,y0=t2.Y-(L.length-1)*lh/2;L.forEach((l,j)=>x.fillText(l,t2.X,y0+j*lh))}
  else{let sz=t2.size;for(;sz>20;sz-=2){x.font=t2.font.replace('@',sz+'px');if(x.measureText(v).width<=t2.maxW)break}
   x.translate(t2.x,t2.y);x.rotate(t2.rot*Math.PI/180);x.textAlign=t2.align;x.textBaseline=t2.base;x.fillText(v,0,0)}x.restore()})}
function el(tag,attr,par){const e=document.createElement(tag);Object.assign(e,attr||{});if(par)par.appendChild(e);return e}
function rng(par,lab,min,max,step,val,fn){const r=el('div',{className:'row'},par);el('span',{textContent:lab},r);const i=el('input',{type:'range',min,max,step,value:val},par);i.oninput=()=>{fn(+i.value);draw()}}
function form(){const f=document.getElementById('f');f.innerHTML='';const t=TPL[cur],S=ST[cur];
 t.texts.forEach((a,i)=>{el('label',{textContent:a.label},f);const inp=el(a.type=='box'?'textarea':'input',{value:S.tx[i].v,type:'text'},f);inp.oninput=()=>{S.tx[i].v=inp.value;draw()};
  if(a.type=='box')rng(f,'Макс. размер шрифта',50,220,2,S.tx[i].s,v=>S.tx[i].s=v)});
 t.slots.forEach((s,i)=>{const d=el('div',{className:'sl'},f);el('label',{textContent:'Фото '+(i+1)},d);const fi=el('input',{type:'file',accept:'image/*'},d);const o=S.sl[i];
  fi.onchange=()=>{const u=fi.files[0];if(!u)return;const im=new Image();im.onload=()=>{o.img=im;draw()};im.src=URL.createObjectURL(u)};
  rng(d,'Масштаб',1,3,0.05,o.z,v=>o.z=v);rng(d,'Сдвиг по горизонтали',-1,1,0.02,o.px,v=>o.px=v);rng(d,'Сдвиг по вертикали',-1,1,0.02,o.py,v=>o.py=v)})}
const ch=document.getElementById('ch');
TPL.forEach((t,i)=>{const b=el('button',{textContent:t.name},ch);b.onclick=()=>{cur=i;[...ch.children].forEach((e,j)=>e.className=j==i?'on':'');form();draw()}});
ch.children[0].className='on';form();
Promise.all(["italic 800 40px Montserrat","700 40px 'Roboto Condensed'","italic 700 40px 'Roboto Condensed'"].map(f=>document.fonts.load(f,'Аа'))).then(draw).catch(draw);
document.getElementById('d').onclick=()=>c.toBlob(async b=>{
 try{const d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:TPL[cur].id+'.png',data:b})}
 catch(e){if(e&&e.code==='declined')return;const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=TPL[cur].id+'.png';a.click()}},'image/png');
</script></body></html>
